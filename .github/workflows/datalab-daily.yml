# 저장소 안에 넣는 위치: .github/workflows/datalab-daily.yml
# 매일 밤 11시(KST)에 fetch_datalab.py를 실행해
# trends/datalab.json과 trends/keywords.json을 갱신하고 저장소에 다시 저장합니다.
# keywords.json은 모니터링 목록(발견 단어 이어받기) 상태 파일입니다.
# GitHub 스케줄러는 정확하지 않습니다(best-effort). 정각(0분)은 가장
# 붐비는 시간이라 몇 시간씩 늦거나 아예 안 뜰 수도 있습니다.
# 그래서 밤 11시 17분(홀수 분)에 실행해, 늦어져도 아침까지 완료되게 합니다.
name: datalab-daily

on:
  schedule:
    - cron: "17 14 * * *" # 매일 23:17 KST (14:17 UTC)
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch DataLab trends
        env:
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
        run: python fetch_datalab.py

      - name: Commit trends JSON
        run: |
          git config user.name "datalab-bot"
          git config user.email "datalab-bot@users.noreply.github.com"
          git add trends/datalab.json trends/keywords.json
          git diff --cached --quiet || git commit -m "datalab $(date -u +%F)"
          git push
